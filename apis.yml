aid: benchmark
name: Benchmark
description: >-
  Benchmark is an American early-stage venture capital firm founded in 1995 by
  Bob Kagle, Bruce Dunlevie, Andy Rachleff, Kevin Harvey, and Val Vaden, and
  headquartered at 140 New Montgomery Street in San Francisco, California (with a
  second office in Woodside). Benchmark is known for its distinctive equal
  partnership structure, where a small number of general partners share ownership
  and carry equally with no junior/senior hierarchy and no managing partner.
  The firm concentrates on leading first institutional rounds — typically Series A
  — and historically kept fund sizes small (around $425M) with a focus on
  consumer, marketplaces, social, open source, developer tools, infrastructure,
  enterprise software, fintech, crypto, and artificial intelligence. Benchmark
  has backed transformational companies including eBay, Uber, Twitter, Instagram,
  Snap, Dropbox, Discord, Docker, Zendesk, Confluent, Elastic, New Relic, Asana,
  Amplitude, Nextdoor, Stitch Fix, Yelp, OpenTable, Zillow, Red Hat, Airtable,
  Benchling, Cockroach Labs, Chainalysis, HackerOne, Contentful, Modern Treasury,
  Stytch, and, more recently, AI-native companies such as LangChain, Cerebras,
  MindsDB, Lovable, Legora, Gumloop, and Starcloud. In 2026 Benchmark broke with
  tradition to raise roughly $2B across two new vehicles, including its first-ever
  dedicated later-stage growth fund. This profile tracks Benchmark's identity and
  its portfolio graph across the API Evangelist network.
